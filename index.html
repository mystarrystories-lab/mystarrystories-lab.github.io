<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jane의 홈페이지</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f7f5ff;
      color: #29243d;
    }

    main {
      max-width: 720px;
      margin: 80px auto;
      padding: 32px;
    }

    h1 {
      color: #7450c8;
    }

    a {
      color: #7450c8;
    }
  </style>
</head>
<body>
  <main>
    <h1>안녕하세요, Jane입니다 👋</h1>
    <p>제 홈페이지에 오신 것을 환영합니다.</p>

    <h2>소개</h2>
    <p>이곳에 나의 소개를 적어 보세요.</p>

    <h2>관심 있는 것</h2>
    <ul>
      <li>영어 공부</li>
      <li>책 읽기</li>
      <li>여행</li>
    </ul>

    <h2>연락처</h2>
    <p>
      <a href="mailto:hello@example.com">이메일 보내기</a>
    </p>
  </main>
</body>
</html>
